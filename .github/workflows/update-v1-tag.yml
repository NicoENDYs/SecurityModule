name: Update floating version tags

# Keeps the floating tags `v1` (major) and `v1.<minor>` pointing at the latest
# matching release, so `uses: nicoendys/securitymodule/...@v1` and the
# `module-ref: v1` defaults in the reusable workflows always resolve to the
# newest 1.x release without editing anything.
#
# Release tags use the `vMAJOR.MINOR.PATCH` form (e.g. v1.7.0).
#
# - Runs automatically whenever a `vX.Y.Z` release tag is pushed: `vX` and
#   `vX.Y` are moved to that tag's commit.
# - Can also be run manually (Actions → "Update floating version tags" → Run
#   workflow). By default it promotes the highest existing `vX.Y.Z` tag; pass
#   `release-tag` to promote a specific one (e.g. to bootstrap `v1` now).
#
# No recursion: the floating tags (`v1`, `v1.7`) are one/two-part and do not
# match the three-part `vX.Y.Z` trigger, and GITHUB_TOKEN pushes don't trigger
# workflows anyway.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release tag to promote (e.g. v1.7.0). Default: the highest vX.Y.Z tag."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  move-floating-tags:
    name: Move floating tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create or move floating tags
        env:
          INPUT_TAG: ${{ inputs.release-tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Resolve which release tag to promote: explicit input → the pushed
          # tag → the highest vX.Y.Z tag in the repo.
          REL="$INPUT_TAG"
          if [ -z "$REL" ] && [ "$REF_TYPE" = "tag" ]; then REL="$REF_NAME"; fi
          if [ -z "$REL" ]; then
            REL="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          fi
          [ -n "$REL" ] || { echo "::error::no vX.Y.Z release tag found"; exit 1; }

          case "$REL" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::unexpected tag format '$REL' (expected vMAJOR.MINOR.PATCH)"; exit 1 ;;
          esac

          SHA=$(git rev-parse --verify "refs/tags/${REL}^{commit}")
          MAJOR="${REL%%.*}"   # v1.7.0 -> v1
          MINOR="${REL%.*}"    # v1.7.0 -> v1.7

          for FLOAT in "$MAJOR" "$MINOR"; do
            git tag -f "$FLOAT" "$SHA"
            git push origin "refs/tags/${FLOAT}" --force
            echo "Pointed ${FLOAT} at ${REL} (${SHA})"
          done

          {
            echo "### 🏷️ Floating tags updated"
            echo ""
            echo "\`${MAJOR}\` and \`${MINOR}\` now point at \`${REL}\` (\`${SHA}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
