name: Secret & IaC Scan

# Reusable (workflow_call): invoked from the consumer's security.yml.
# Complements trivy.yml — Gitleaks scans the full git history for leaked
# credentials, and Checkov adds broader IaC policy coverage than trivy-config.
# Both run via Docker, consistent with the "install nothing on the host"
# philosophy. Image tags are kept in sync with versions.env by update-versions.yml.
on:
  workflow_call:

permissions:
  contents: read
  security-events: write   # upload SARIF to the Security tab
  actions: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0          # Gitleaks scans the whole git history

      - name: Gitleaks (via Docker)
        run: |
          docker run --rm -v "$PWD":/repo \
            zricethezav/gitleaks:v8.21.2 \
            detect \
              --source=/repo \
              --report-format=sarif \
              --report-path=/repo/gitleaks.sarif \
              --redact \
              --exit-code=0

      - name: Upload SARIF (Gitleaks)
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        continue-on-error: true   # non-blocking if Code Scanning is disabled
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Summarise findings (Gitleaks)
        if: always()
        run: |
          set -euo pipefail
          COUNT=0
          [ -f gitleaks.sarif ] && COUNT=$(jq '[.runs[].results[]] | length' gitleaks.sarif 2>/dev/null || echo 0)
          {
            echo "### 🔑 Gitleaks — leaked secrets (git history)"
            echo ""
            echo "Potential secrets found: **${COUNT}**"
            echo ""
            echo "See **Security → Code scanning alerts** (category \`gitleaks\`) for details."
          } >> "$GITHUB_STEP_SUMMARY"

  checkov:
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkov (via Docker)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/tf \
            bridgecrew/checkov:3.2.334 \
              --directory /tf \
              --output sarif \
              --output-file-path /tf \
              --soft-fail
          # To restrict to specific frameworks, add e.g.:
          #   --framework dockerfile github_actions secrets terraform kubernetes

          # Checkov names the SARIF `results_sarif.sarif` when given a directory
          # in --output-file-path (NOT `results.sarif`). Normalise it to a stable
          # name for the upload, and fail loudly if the scan produced nothing —
          # so a future Checkov rename is caught instead of silently skipped.
          if [ -f results_sarif.sarif ] && [ ! -f results.sarif ]; then
            mv results_sarif.sarif results.sarif
          fi
          [ -f results.sarif ] || { echo "::error::Checkov produced no SARIF (expected results_sarif.sarif). Check the output above."; exit 1; }

      - name: Upload SARIF (Checkov)
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        continue-on-error: true   # non-blocking if Code Scanning is disabled
        with:
          sarif_file: results.sarif
          category: checkov

      - name: Summarise findings (Checkov)
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          [ -f results.sarif ] && FAILED=$(jq '[.runs[].results[]] | length' results.sarif 2>/dev/null || echo 0)
          {
            echo "### 🏗️ Checkov — IaC misconfigurations"
            echo ""
            echo "Failed policy checks: **${FAILED}**"
            echo ""
            echo "See **Security → Code scanning alerts** (category \`checkov\`) for details."
          } >> "$GITHUB_STEP_SUMMARY"
