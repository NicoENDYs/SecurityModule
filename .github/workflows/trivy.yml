name: Trivy Security Scan

# This workflow is designed exclusively for workflow_call (reusable).
# It does NOT run on push/PR/schedule in this repo — those triggers live in ci.yml.
#
# Trivy runs via the pinned aquasec/trivy Docker image (version from the
# module's versions.env), consistent with the rest of the module. The previous
# implementation used aquasecurity/trivy-action, which downloads the Trivy
# binary at run time (setup-trivy + install.sh) — that download failed on the
# runner and produced no SARIF. Docker avoids that fragility entirely.
on:
  workflow_call:
    inputs:
      image-ref:
        description: "Docker image to scan (leave empty to scan filesystem only)"
        required: false
        type: string
        default: ""
      severity:
        description: "Comma-separated severity levels to report"
        required: false
        type: string
        default: "HIGH,CRITICAL"
      fail-on-findings:
        description: "Exit with error code if vulnerabilities are found"
        required: false
        type: boolean
        default: false
      trivy-config:
        description: "Path to a Trivy config file in your repository (leave empty to use the .trivy.yaml shipped with SecurityModule)"
        required: false
        type: string
        default: ""
      module-ref:
        description: "Git ref of NicoENDYs/SecurityModule to source versions.env + the default .trivy.yaml from"
        required: false
        type: string
        default: "v1"
    outputs:
      critical-count:
        description: "Number of CRITICAL vulnerabilities found in the filesystem scan"
        value: ${{ jobs.trivy-fs.outputs.critical-count }}

permissions:
  contents: read
  security-events: write  # Required to upload SARIF results
  actions: read

jobs:
  trivy-fs:
    name: Filesystem Scan
    runs-on: ubuntu-latest
    outputs:
      critical-count: ${{ steps.parse.outputs.critical }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # versions.env (Trivy image tag) and the default .trivy.yaml both ship with
      # SecurityModule, not with the consumer repo — check the module out.
      - name: Checkout SecurityModule (versions.env + default .trivy.yaml)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: NicoENDYs/SecurityModule
          ref: ${{ inputs.module-ref || 'v1' }}
          path: .security-module

      - name: Run Trivy — filesystem scan (via Docker)
        env:
          SEVERITY: ${{ inputs.severity || 'HIGH,CRITICAL' }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          TRIVY_CONFIG_INPUT: ${{ inputs.trivy-config }}
        run: |
          set -euo pipefail
          TRIVY_VERSION="$(sed -n 's/^TRIVY_VERSION=//p' .security-module/versions.env)"
          [ -n "$TRIVY_VERSION" ] || { echo "::error::TRIVY_VERSION not found in versions.env"; exit 1; }
          CFG="${TRIVY_CONFIG_INPUT:-.security-module/.trivy.yaml}"
          EXIT_CODE="0"; [ "$FAIL_ON_FINDINGS" = "true" ] && EXIT_CODE="1"
          docker run --rm -w /project -v "$PWD":/project \
            "aquasec/trivy:${TRIVY_VERSION}" fs \
              --config "$CFG" \
              --severity "$SEVERITY" \
              --exit-code "$EXIT_CODE" \
              --ignore-unfixed \
              --format sarif \
              --output /project/trivy-fs-results.sarif \
              .

      - name: Parse critical count from SARIF
        id: parse
        if: always()
        run: |
          COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-fs-results.sarif 2>/dev/null || echo 0)
          echo "critical=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "### 🛡️ Trivy — filesystem scan"
            echo ""
            echo "CRITICAL (error-level) findings: **${COUNT}**"
            echo ""
            echo "See **Security → Code scanning alerts** (category \`trivy-filesystem\`) for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy FS scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        # Non-blocking: repos without Code Scanning enabled (e.g. private repos
        # without GitHub Advanced Security) still get the scan + job summary.
        continue-on-error: true
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: "trivy-filesystem"

  trivy-image:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    if: ${{ inputs.image-ref != '' }}
    steps:
      - name: Checkout SecurityModule (versions.env)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: NicoENDYs/SecurityModule
          ref: ${{ inputs.module-ref || 'v1' }}
          path: .security-module

      - name: Run Trivy — image scan (via Docker)
        env:
          SEVERITY: ${{ inputs.severity || 'HIGH,CRITICAL' }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -euo pipefail
          TRIVY_VERSION="$(sed -n 's/^TRIVY_VERSION=//p' .security-module/versions.env)"
          [ -n "$TRIVY_VERSION" ] || { echo "::error::TRIVY_VERSION not found in versions.env"; exit 1; }
          EXIT_CODE="0"; [ "$FAIL_ON_FINDINGS" = "true" ] && EXIT_CODE="1"
          docker run --rm -w /project -v "$PWD":/project \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "aquasec/trivy:${TRIVY_VERSION}" image \
              --severity "$SEVERITY" \
              --exit-code "$EXIT_CODE" \
              --ignore-unfixed \
              --format sarif \
              --output /project/trivy-image-results.sarif \
              "$IMAGE_REF"

      - name: Upload Trivy image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true   # non-blocking if Code Scanning is disabled
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"

  trivy-config:
    name: IaC / Misconfiguration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout SecurityModule (versions.env + default .trivy.yaml)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: NicoENDYs/SecurityModule
          ref: ${{ inputs.module-ref || 'v1' }}
          path: .security-module

      - name: Run Trivy — config scan (IaC misconfigurations, via Docker)
        env:
          SEVERITY: ${{ inputs.severity || 'HIGH,CRITICAL' }}
          TRIVY_CONFIG_INPUT: ${{ inputs.trivy-config }}
        run: |
          set -euo pipefail
          TRIVY_VERSION="$(sed -n 's/^TRIVY_VERSION=//p' .security-module/versions.env)"
          [ -n "$TRIVY_VERSION" ] || { echo "::error::TRIVY_VERSION not found in versions.env"; exit 1; }
          CFG="${TRIVY_CONFIG_INPUT:-.security-module/.trivy.yaml}"
          docker run --rm -w /project -v "$PWD":/project \
            "aquasec/trivy:${TRIVY_VERSION}" config \
              --config "$CFG" \
              --severity "$SEVERITY" \
              --exit-code 0 \
              --format sarif \
              --output /project/trivy-config-results.sarif \
              .

      - name: Upload Trivy config scan results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        continue-on-error: true   # non-blocking if Code Scanning is disabled
        with:
          sarif_file: "trivy-config-results.sarif"
          category: "trivy-config"
